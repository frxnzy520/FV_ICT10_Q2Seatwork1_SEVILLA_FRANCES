
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>ICT 10</title>

    
<style>
    body {
        text-align: center;
        font-family: "Trebuchet MS", Arial, sans-serif;
        background: linear-gradient(135deg, #f5edff, #ffeaf5, #eaf5ff);
        color: #665080;
        margin: 0;
        padding: 40px 20px;
    }

    h1 {
        color: #9475d9;
        font-size: 36px;
        text-shadow: 2px 2px #ffffff;
        margin-bottom: 35px;
    }

    label {
        display: block;
        font-size: 18px;
        font-weight: bold;
        margin: 18px 0 8px;
    }

    input {
        width: 80%;
        max-width: 400px;
        padding: 14px;
        border: 3px solid #d6c5ff;
        border-radius: 20px;
        background-color: #ffffff;
        color: #665080;
        font-size: 16px;
        text-align: center;
        outline: none;
        box-sizing: border-box;
        transition: 0.3s;
    }

    input:focus {
        border-color: #f5a9d5;
        box-shadow: 0 0 10px #f5c9e5;
    }

    input::placeholder {
        color: #b6a8ca;
    }

    button {
        display: block;
        margin: 25px auto;
        padding: 13px 35px;
        border: none;
        border-radius: 30px;
        background: linear-gradient(135deg, #c7a8ff, #a58be8);
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 0 #8870c7;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 0 #8870c7;
        background: linear-gradient(135deg, #f4a9d4, #d995cb);
    }

    button:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #8870c7;
    }

    #output {
        max-width: 600px;
        min-height: 100px;
        margin: 30px auto;
        padding: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border: 3px solid #ffb9df;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 6px 15px #d9c8e633;
        font-size: 18px;
        overflow-wrap: anywhere;
    }
</style>

</head>

<body>
    <h1>ICT CLUB CHECKER</h1>

    <label for="first_name">First Name:</label>
    <input type="text" id="first_name" placeholder="Enter first name">

    <br><br>

    <label for="last_name">Last Name:</label>
    <input type="text" id="last_name" placeholder="Enter last name">

    <button py-click="check_member">Submit</button>

    <div id="output"></div>


    <script type="py" src="main.py"></script>
</body>
</html>
